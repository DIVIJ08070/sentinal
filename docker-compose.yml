# SENTINEL — full stack in containers.
#
#   Core (always):   PostgreSQL + catalogue adapter + backend API + frontend.
#     docker compose up --build
#     open http://localhost:8080   (click Sync to onboard the 30 cameras)
#
#   Live analytics (needs your grid credential in .env):
#     docker compose --profile live up --build
#
# Copy .env.docker.example to .env and fill it in first.
name: sentinel

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel}"]
      interval: 5s
      timeout: 3s
      retries: 10

  adapter:
    build: .
    command: python ingest/grid_adapter.py --file ingest/grid_catalogue.json --port 8890
    environment:
      GRID_HLS_TEMPLATE: ${GRID_HLS_TEMPLATE:-http://localhost:8888/{id}/index.m3u8}
    expose:
      - "8890"

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
      adapter:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel}@db:5432/${POSTGRES_DB:-sentinel}
      SENTINEL_HOST: http://adapter:8890
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/stats"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8080:80"

  # --- live analytics (profile: live) — needs GRID_RTSP_AUTH ---
  relay:
    build: .
    profiles: ["live"]
    command: python ingest/hls_relay.py --cams cam01,cam06,cam16,cam23,cam27 --port 8888
    environment:
      GRID_RTSP_AUTH: ${GRID_RTSP_AUTH:-}
    ports:
      - "8888:8888"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    profiles: ["live"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8000
      GRID_RTSP_AUTH: ${GRID_RTSP_AUTH:-}
    volumes:
      - modelcache:/root/.cache

volumes:
  pgdata:
  modelcache:
